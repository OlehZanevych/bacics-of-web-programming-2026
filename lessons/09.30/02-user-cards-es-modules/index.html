<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Картки користувачів (ES-модулі) — форма, стан, DOM</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">

    <!-- type="module": відкладене виконання (як defer), власна область
         видимості кожного файлу, import/export — main.js сам підтягує
         state.js, render.js, storage.js і photo.js.

         ⚠️ Модулі НЕ працюють через file:// (політика CORS): відкрийте
         сторінку через Live Server / вбудований сервер WebStorm /
         npx serve. Порівняйте з 01-user-cards-classic-scripts. -->
    <script type="module" src="js/main.js"></script>
</head>

<body class="page">
<header class="page__header">
    <h1 class="page__title">Картки користувачів</h1>
    <p class="page__subtitle">форма → стан → рендеринг DOM → localStorage</p>
    <p class="page__badge">Варіант 2 · ES-модулі <code>&lt;script type="module"&gt;</code> · потрібен локальний сервер</p>
</header>

<main class="page__main">
    <!-- Уся розмітка форми — звичайний HTML. Поведінку додає JS. -->
    <form class="user-form" id="user-form" autocomplete="off">
        <label class="user-form__label" for="first-name">Ім'я</label>
        <input class="user-form__input" id="first-name" name="firstName" required maxlength="60">

        <label class="user-form__label" for="last-name">Прізвище</label>
        <input class="user-form__input" id="last-name" name="lastName" required maxlength="60">

        <label class="user-form__label" for="role">Роль</label>
        <select class="user-form__input" id="role" name="role">
            <option>Студент</option>
            <option>Викладач</option>
            <option>Аспірант</option>
        </select>

        <label class="user-form__label" for="photo">Фото</label>
        <div class="user-form__dropzone" id="dropzone">
            <img class="user-form__preview" id="photo-preview" alt="Попередній перегляд фото" hidden>
            <input class="user-form__input" id="photo" name="photo" type="file" accept="image/*">
            <span class="user-form__hint">або перетягніть файл сюди</span>
        </div>

        <div class="user-form__actions">
            <button class="button button--primary" type="submit">Додати</button>
            <button class="button" type="button" data-action="random">Випадковий</button>
            <button class="button" type="button" data-action="xss">XSS-атака</button>
            <button class="button" type="reset">Очистити форму</button>
        </div>
    </form>

    <section class="toolbar" aria-label="Пошук і налаштування">
        <label class="toolbar__field">
            Пошук <kbd>/</kbd>
            <input class="toolbar__search" id="search" type="search" placeholder="Ім'я або прізвище">
        </label>
        <output class="toolbar__counter" id="counter"></output>
        <label class="toolbar__field toolbar__field--danger">
            <input id="unsafe" type="checkbox">
            небезпечний рендеринг через innerHTML
        </label>
        <button class="button" type="button" id="clear-all">Видалити всіх</button>
    </section>

    <ul class="user-list" id="user-list"></ul>
    <p class="user-list__empty" id="empty-message" hidden></p>
</main>

<!-- <template> браузер розбирає, але НЕ показує. JS клонує його для кожної
     картки. Зверніть увагу: тут немає жодного обробника onclick — усі кліки
     ловить ОДИН обробник на <ul> (делегування подій). -->
<template id="user-card-template">
    <li class="user-card">
        <img class="user-card__photo" alt="" hidden>
        <span class="user-card__initials" aria-hidden="true"></span>
        <div class="user-card__body">
            <h2 class="user-card__name" title="Двічі клацніть, щоб редагувати"></h2>
            <p class="user-card__meta"></p>
        </div>
        <button class="user-card__button" type="button" data-action="favorite" aria-pressed="false"
                aria-label="Додати в обрані">☆</button>
        <button class="user-card__button" type="button" data-action="delete" aria-label="Видалити">×</button>
    </li>
</template>

<!-- Звичайний вбудований скрипт (НЕ модуль) виконується навіть через file://.
     Він лише пояснює, чому сторінка «мертва», якщо її відкрили як файл. -->
<script>
    if (location.protocol === 'file:') {
        const warning = document.createElement('p');
        warning.className = 'page__warning';
        warning.textContent =
            'Сторінку відкрито як файл (file://), тому ES-модулі не завантажились — ' +
            'кнопки не працюватимуть. Помилку CORS видно в консолі DevTools. ' +
            'Відкрийте сторінку через локальний сервер (Live Server, WebStorm, npx serve).';
        document.querySelector('.page__header').append(warning);
    }
</script>
</body>
</html>
